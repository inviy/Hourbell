<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hourbell</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('assets/fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Galmuri9'; src: url('assets/fonts/Galmuri9.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #0a0814; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    @media (orientation: portrait) and (pointer: coarse) { body { align-items: flex-start; padding-top: 12vh; box-sizing: border-box; } }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    /* keep the font warm so canvas text renders on first use */
    .preload { position: absolute; left: -999px; font-family: 'Galmuri11'; }
    .preload2 { position: absolute; left: -999px; font-family: 'Galmuri9'; }
  </style>
</head>
<body>
  <canvas id="screen" width="480" height="270"></canvas>
  <span class="preload">가</span><span class="preload2">가</span>
  <script src="src/core.js"></script>
  <script src="src/font.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/tiles.js"></script>
  <script src="src/objects.js"></script>
  <script src="src/maps.js"></script>
  <script src="src/world.js"></script>
  <script src="src/creatures.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/field.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
